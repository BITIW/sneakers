[package]
name = "sneakers"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sneakers"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
bitflags = "2.6"
blake3 = "1.5"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
filetime = "0.2"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rmp-serde = "1.3"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
walkdir = "2.5"
zeroize = "1.8"
zstd = { version = "0.13", features = ["zstdmt"] }

[dev-dependencies]
tempfile = "3.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false
